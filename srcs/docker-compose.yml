services:
  db:
    image: mariadb
    container_name: study_mariadb
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: 1234
      MARIADB_DATABASE: demo_db
      MARIADB_USER: demo
      MARIADB_PASSWORD: 1234
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
